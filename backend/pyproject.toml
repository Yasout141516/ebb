[project]
name = "ebb"
version = "0.1.0"
description = "Adaptive AI study tutor built on the forgetting curve"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain-core>=1.6.10,<2",
    "langchain-google-genai>=4.4.2,<5",
    "langchain-groq>=1.1.3,<2",
    "langgraph>=1.2.15,<2",
    "psycopg[binary]>=3.3.6,<4",
    "psycopg-pool>=3.3.3,<4",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "rich>=15.0.0,<16",
    "typer>=0.27.3,<1",
    "tzdata>=2026.5",
    "tzlocal>=5.4.4,<6",
]

[project.scripts]
ebb = "ebb.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.17.1,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres database (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
