services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ebb
      POSTGRES_PASSWORD: ebb
      POSTGRES_DB: ebb
    ports:
      - "${EBB_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - ebb-pgdata:/var/lib/postgresql
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ebb -d ebb"]
      interval: 5s
      timeout: 5s
      retries: 10

  ebb:
    build: ./backend
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ebb:ebb@db:5432/ebb
    # tini as PID 1: a closed terminal or `docker stop` then reaches ebb with the default
    # signal actions, as natively, so the session stays resumable.
    init: true
    volumes:
      - ./notes:/home/ebb/notes:ro
    stdin_open: true
    tty: true

  api:
    build: ./backend
    command: ["serve"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://ebb:ebb@db:5432/ebb
    init: true

volumes:
  ebb-pgdata:
