<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebb prototype</title>
<!-- Ebb clickable prototype. Single file: React 18.3.1 is inlined; fonts load from Google Fonts when online. -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ebb{--bg:#F5EFE4;--surface:#FBF8F2;--surface-2:#EFE7D8;--line:#DCD1BD;--ink:#0F1B2D;--ink-2:#434D5C;--ink-3:#5C6470;--accent:#3E8E8B;--accent-ink:#22605C;--accent-soft:#DCEAE5;--primary-bg:#0F1B2D;--primary-ink:#F5EFE4;--focus:#22605C;--correct:#2B6E45;--correct-soft:#E1EEE4;--partial:#8A5A0F;--partial-soft:#F6EAD3;--incorrect:#A8382F;--incorrect-soft:#F5E1DC;--shadow:0 1px 2px rgba(15,27,45,.06),0 10px 30px rgba(15,27,45,.07);--serif:'Newsreader',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
.ebb.dark{--bg:#0B1422;--surface:#121D2E;--surface-2:#1A2739;--line:#2A384D;--ink:#EDE6D8;--ink-2:#C2BBAD;--ink-3:#9D9789;--accent:#5FB3AE;--accent-ink:#7CC7C1;--accent-soft:#16312F;--primary-bg:#EDE6D8;--primary-ink:#0B1422;--focus:#7CC7C1;--correct:#74C493;--correct-soft:#16301F;--partial:#E2B261;--partial-soft:#33280F;--incorrect:#F08C80;--incorrect-soft:#3A1D1B;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}
.ebb *{box-sizing:border-box}
.ebb a{color:var(--accent-ink)}
.ebb a:hover{color:var(--ink)}
.ebb :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ebb .hov:hover{background:var(--surface-2)}
.ebb .pbtn:hover{opacity:.9}
.ebb input::placeholder{color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){.ebb *{animation:none !important;transition:none !important}}
@keyframes ebb-pulse{50%{opacity:.45}}
.ebb input::placeholder,.ebb textarea::placeholder{color:var(--ink-3)}
.ebb .opt:hover{border-color:var(--ink-3)}
.ebb .caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;background:var(--accent);animation:ebb-blink 1s steps(1) infinite}
.ebb .skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--line) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:ebb-shimmer 1.4s linear infinite;border-radius:6px}
@keyframes ebb-blink{50%{opacity:0}}
@keyframes ebb-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ebb-tide{0%{height:12%}50%{height:72%}100%{height:12%}}
.ebb :focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.ebb .mult:hover{border-color:var(--ink-3)}

body{margin:0;background:#D9D2C6}
.proto-stage{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 24px;box-sizing:border-box}
.proto-menu{position:fixed;left:16px;bottom:16px;z-index:1000;font:500 13px 'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.proto-menu button{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(245,239,228,.25);background:#0F1B2D;color:#F5EFE4;font:inherit;cursor:pointer;opacity:.85}
.proto-menu button:hover,.proto-menu button:focus-visible{opacity:1}
.proto-menu :focus-visible{outline:2px solid #3E8E8B;outline-offset:2px}
.proto-panel{width:260px;max-height:70vh;overflow:auto;padding:12px;border-radius:14px;background:#0F1B2D;color:#F5EFE4;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.proto-group p{margin:8px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9D9789}
.proto-group a{display:block;padding:8px;border-radius:8px;color:#EDE6D8;text-decoration:none}
.proto-group a:hover{background:#1A2739}
.proto-group a[aria-current]{background:#16312F;color:#7CC7C1}

</style>
</head>
<body>
<div id="root"></div>
<template id="tpl-Main">

<div class="{{rootClass}}" style="min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans); display: flex; flex-wrap: wrap;">
  <section style="flex: 1 1 520px; min-width: 0; background: var(--surface-2); padding: 48px clamp(24px, 6vw, 88px); display: flex; flex-direction: column; justify-content: space-between; gap: 48px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="18" height="26" viewBox="0 0 18 26" aria-hidden="true"><rect x="1" y="1" width="16" height="24" rx="5" style="fill: none; stroke: var(--ink); stroke-width: 1.5"></rect><rect x="3.5" y="11" width="11" height="11.5" rx="2.5" style="fill: var(--accent)"></rect></svg>
      <span style="font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: -0.01em;">Ebb</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 28px; max-width: 560px;">
      <h1 style="margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(40px, 4.4vw, 60px); line-height: 1.05; letter-spacing: -0.02em;">Learn against the forgetting curve.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: var(--ink-2);">Ebb quizzes you, grades your answers against your own notes, and brings each idea back just before it slips away.</p>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
        <svg viewBox="0 0 480 200" width="100%" role="img" aria-label="Memory strength over two weeks: without review it decays steadily; with reviews on days 1, 3 and 7 it climbs back each time and decays more slowly." style="max-width: 480px;">
          <line x1="20" y1="180" x2="470" y2="180" style="stroke: var(--line); stroke-width: 1"></line>
          <path d="M20 26 C 70 110, 150 160, 470 172" style="fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 5"></path>
          <path d="M20 26 C 40 66, 60 80, 82 88 L82 30 C 112 66, 142 78, 172 82 L172 28 C 220 54, 262 66, 302 70 L302 26 C 362 44, 412 52, 470 56" style="fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round"></path>
          <circle cx="82" cy="30" r="4" style="fill: var(--accent)"></circle>
          <circle cx="172" cy="28" r="4" style="fill: var(--accent)"></circle>
          <circle cx="302" cy="26" r="4" style="fill: var(--accent)"></circle>
          <text x="82" y="196" text-anchor="middle" style="font: 500 11px var(--sans); fill: var(--ink-3)">Day 1</text>
          <text x="172" y="196" text-anchor="middle" style="font: 500 11px var(--sans); fill: var(--ink-3)">Day 3</text>
          <text x="302" y="196" text-anchor="middle" style="font: 500 11px var(--sans); fill: var(--ink-3)">Day 7</text>
          <text x="470" y="164" text-anchor="end" style="font: 400 11px var(--sans); fill: var(--ink-3)">without review</text>
          <text x="470" y="46" text-anchor="end" style="font: 500 11px var(--sans); fill: var(--accent-ink)">with Ebb</text>
        </svg>
      </figure>
    </div>
    <p style="margin: 0; font-size: 13px; color: var(--ink-3);">Built for students who would rather remember it in May than cram it in April.</p>
  </section>

  <main style="flex: 999 1 480px; min-width: 0; padding: 32px clamp(24px, 5vw, 64px) 48px; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: flex-end;">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" class="hov" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
        <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      </button>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 0;">
      <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <h2 style="margin: 0; font-family: var(--serif); font-weight: 500; font-size: 34px; letter-spacing: -0.01em;">Welcome back</h2>
          <p style="margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.5;">Sign in to pick up where your memory left off.</p>
        </div>
        <a href="Onboarding.dc.html" class="hov" style="height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 500; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: var(--shadow);">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h6M16.5 7.5A6 6 0 1 0 18 13"></path></svg>
          Continue with Google
        </a>
        <div style="display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 13px;">
          <span style="flex: 1; height: 1px; background: var(--line);"></span>or<span style="flex: 1; height: 1px; background: var(--line);"></span>
        </div>
        <form style="display: flex; flex-direction: column; gap: 12px;">
          <label for="email" style="font-size: 14px; font-weight: 500;">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@university.edu" style="height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; font: 400 16px var(--sans);">
          <a href="Onboarding.dc.html" class="pbtn" style="height: 48px; border-radius: 10px; background: var(--primary-bg); color: var(--primary-ink); text-decoration: none; font-weight: 500; font-size: 15px; display: flex; align-items: center; justify-content: center;">Email me a sign-in link</a>
        </form>
        <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-3);">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
      </div>
    </div>
  </main>
</div>
</template>
<template id="tpl-Onboarding">

<div class="{{rootClass}}" style="min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column;">
  <header style="height: 64px; padding: 0 clamp(16px, 3vw, 32px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="16" height="23" viewBox="0 0 18 26" aria-hidden="true"><rect x="1" y="1" width="16" height="24" rx="5" style="fill: none; stroke: var(--ink); stroke-width: 1.5"></rect><rect x="3.5" y="11" width="11" height="11.5" rx="2.5" style="fill: var(--accent)"></rect></svg>
      <span style="font-family: var(--serif); font-size: 22px; font-weight: 600;">Ebb</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" class="hov" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
        <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      </button>
      <span aria-label="Signed in as Nadia Rahman" style="width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">NR</span>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 0;">
    <aside style="flex: 1 1 260px; max-width: 100%; padding: 32px clamp(16px, 3vw, 32px); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px;">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);">Your subjects</h2>
      <div style="border: 1px dashed var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 8px;">
        <p style="margin: 0; font-family: var(--serif); font-size: 18px;">No subjects yet</p>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2);">The first one you set up will appear here, with its memory levels.</p>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; padding: clamp(24px, 5vw, 64px) clamp(16px, 4vw, 48px); display: flex; justify-content: center;">
      <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 28px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <p style="margin: 0; font-size: 13px; font-weight: 500; color: var(--accent-ink);">Step 1 of 1 · New subject</p>
          <h1 style="margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -0.015em;">What are you studying?</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 560px;">Type a topic and Ebb will build questions from general knowledge, or upload your notes so every grade can cite them.</p>
        </div>

        <div role="tablist" aria-label="How to add a subject" style="display: inline-flex; align-self: flex-start; padding: 4px; border-radius: 12px; background: var(--surface-2); gap: 4px;">
          <button type="button" role="tab" aria-selected="{{uploadSel}}" onClick="{{pickUpload}}" style="{{uploadTabStyle}}">Upload notes</button>
          <button type="button" role="tab" aria-selected="{{topicSel}}" onClick="{{pickTopic}}" style="{{topicTabStyle}}">Type a topic</button>
        </div>

        <sc-if value="{{isTopic}}" hint-placeholder-val="{{false}}">
          <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);">
            <label for="topic" style="font-size: 14px; font-weight: 500;">Topic</label>
            <input id="topic" type="text" value="{{topic}}" onChange="{{onTopic}}" placeholder="e.g. Computer Networks" style="height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 16px; font: 400 17px var(--sans);">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
              <span style="font-size: 13px; color: var(--ink-3);">Try:</span>
              <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="3">
                <button type="button" onClick="{{s.pick}}" class="hov" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 14px var(--sans); cursor: pointer;">{{s.label}}</button>
              </sc-for>
            </div>
          </section>
        </sc-if>

        <sc-if value="{{isUpload}}" hint-placeholder-val="{{true}}">
          <section style="display: flex; flex-direction: column; gap: 16px;">
            <div style="background: var(--surface); border: 1.5px dashed var(--line); border-radius: 16px; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;">
              <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--accent-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"></path></svg>
              <p style="margin: 0; font-family: var(--serif); font-size: 20px;">Drop lecture notes here</p>
              <p style="margin: 0; font-size: 14px; color: var(--ink-2);">PDF, TXT or MD · up to 20 MB per file · 5 files per subject</p>
              <button type="button" onClick="{{chooseFile}}" class="hov" style="margin-top: 6px; height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font: 500 15px var(--sans); cursor: pointer;">Choose file</button>
            </div>

            <div role="note" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14px; line-height: 1.5; color: var(--ink-2);">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
              <span><strong style="color: var(--ink); font-weight: 600;">Don't upload sensitive documents.</strong> Files are processed by an AI model to write questions and cite answers.</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);">Sources</h2>
              <sc-if value="{{noFile}}" hint-placeholder-val="{{true}}">
                <p style="margin: 0; padding: 16px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; color: var(--ink-3);">No uploads yet. Choose a file, or skip and type a topic instead.</p>
              </sc-if>
              <sc-if value="{{hasFile}}" hint-placeholder-val="{{false}}">
                <div style="padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 10px;">
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <span aria-hidden="true" style="width: 36px; height: 44px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font: 600 10px var(--mono); color: var(--ink-2);">PDF</span>
                    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                      <span style="font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">CSE321_Lecture_Notes_Wk1-6.pdf</span>
                      <span style="font-size: 13px; color: var(--ink-3);">4.2 MB · 38 pages · {{fileStatus}}</span>
                    </div>
                    <sc-if value="{{isReady}}" hint-placeholder-val="{{false}}">
                      <span style="font-size: 13px; font-weight: 500; color: var(--correct); display: inline-flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Ready</span>
                    </sc-if>
                  </div>
                  <sc-if value="{{isBusy}}" hint-placeholder-val="{{false}}">
                    <div role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{progress}}" style="height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden;">
                      <div style="{{barStyle}}"></div>
                    </div>
                  </sc-if>
                  <sc-if value="{{isReady}}" hint-placeholder-val="{{false}}">
                    <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                      <span style="font-size: 13px; color: var(--ink-2);">8 concepts found:</span>
                      <sc-for list="{{concepts}}" as="c" hint-placeholder-count="8">
                        <span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 500;">{{c}}</span>
                      </sc-for>
                    </div>
                  </sc-if>
                </div>
              </sc-if>
            </div>
          </section>
        </sc-if>

        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--line);">
          <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 16px;">
            <label for="subj" style="font-size: 13px; color: var(--ink-3);">Subject name</label>
            <input id="subj" type="text" value="{{subject}}" onChange="{{onSubject}}" style="height: 40px; min-width: 260px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 12px; font: 500 15px var(--sans);">
          </div>
          <a href="Workspace.dc.html" class="pbtn" style="margin-top: 16px; height: 52px; padding: 0 24px; border-radius: 12px; background: var(--primary-bg); color: var(--primary-ink); text-decoration: none; font-weight: 500; font-size: 16px; display: inline-flex; align-items: center; gap: 10px;">Start studying
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
        </div>
      </div>
    </main>
  </div>
</div>
</template>
<template id="tpl-Workspace">

        <a href="Dashboard.dc.html" class="hov" style="height: 40px; padding: 0 14px; border-radius: 8px; display: inline-flex; align-items: center; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500;">Progress</a>

    <div style="display: flex; align-items: center; gap: 12px;">
      <span role="status" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2);"><span aria-hidden="true" style="{{statusDot}}"></span>{{statusText}}</span>
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" class="hov" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
        <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      </button>
      <span aria-label="Signed in as Nadia Rahman" style="width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">NR</span>
    </div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch;">

    <!-- LEFT: subjects + sources -->
    <aside aria-label="Subjects and sources" style="flex: 1 1 248px; max-width: 100%; padding: 24px 20px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 28px;">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);">Subjects</h2>
        <a href="Workspace.dc.html" aria-current="page" style="padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 12px;">
          <span aria-hidden="true" style="position: relative; width: 14px; height: 32px; border: 1.5px solid var(--ink-3); border-radius: 4px; flex: none;"><span style="position: absolute; left: 2px; right: 2px; bottom: 2px; height: calc((100% - 4px) * .55); background: var(--accent); border-radius: 2px;"></span></span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-weight: 500; font-size: 15px;">Computer Networks</span>
            <span style="font-size: 13px; color: var(--ink-3);">8 concepts · {{dueCount}} due today</span>
          </span>
        </a>
        <a href="Onboarding.dc.html" class="hov" style="height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; color: var(--ink-2); text-decoration: none; font-size: 14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>New subject
        </a>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);">Sources</h2>
        <div style="padding: 12px; border-radius: 10px; border: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start;">
          <span aria-hidden="true" style="width: 30px; height: 38px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font: 600 9px var(--mono); color: var(--ink-2); flex: none;">PDF</span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-weight: 500; font-size: 14px; overflow-wrap: anywhere;">CSE321_Lecture_Notes_Wk1-6.pdf</span>
            <span style="font-size: 12px; color: var(--ink-3);">38 pages · 4.2 MB · indexed</span>
          </span>
        </div>
        <a href="Onboarding.dc.html" class="hov" style="height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; color: var(--ink-2); text-decoration: none; font-size: 14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M12 5v14M5 12h14"></path></svg>Add source
        </a>
        <p style="margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-3);">PDF, TXT, MD · max 20 MB. Don't upload sensitive documents.</p>
      </section>
    </aside>

    <!-- CENTER: chat -->
    <main aria-label="Tutor chat" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
      <sc-if value="{{waking}}" hint-placeholder-val="{{false}}">
        <div role="status" aria-live="polite" style="flex: 1; min-height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 48px 24px; text-align: center;">
          <span aria-hidden="true" style="position: relative; width: 36px; height: 84px; border: 2px solid var(--ink-3); border-radius: 10px;"><span style="position: absolute; left: 4px; right: 4px; bottom: 4px; height: 40%; border-radius: 5px; background: var(--accent); animation: ebb-tide 2.4s ease-in-out infinite;"></span></span>
          <p style="margin: 0; font-family: var(--serif); font-size: 26px;">Waking up the tutor…</p>
          <p style="margin: 0; max-width: 380px; font-size: 15px; line-height: 1.55; color: var(--ink-2);">After a quiet spell the tutor takes about 20 seconds to start. Your memory levels are loading in the meantime.</p>
        </div>
      </sc-if>

      <sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
        <div style="flex: 1; padding: 28px clamp(16px, 3vw, 40px) 16px; display: flex; flex-direction: column; gap: 18px; max-width: 860px; width: 100%; margin: 0 auto;">
          <sc-for list="{{thread}}" as="it" hint-placeholder-count="8">

            <sc-if value="{{it.isDay}}" hint-placeholder-val="{{false}}">
              <p style="margin: 0; text-align: center; font-size: 12px; color: var(--ink-3); letter-spacing: .04em;">{{it.text}}</p>
            </sc-if>

            <sc-if value="{{it.isTutor}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 6px; max-width: 640px;">
                <span style="font-size: 12px; font-weight: 600; color: var(--accent-ink);">Ebb</span>
                <p style="margin: 0; font-size: 16px; line-height: 1.6;">{{it.text}}</p>
                <sc-if value="{{it.hasCite}}" hint-placeholder-val="{{false}}">
                  <span style="align-self: flex-start; font: 500 12px var(--mono); padding: 4px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink);">{{it.cite}}</span>
                </sc-if>
              </div>
            </sc-if>

            <sc-if value="{{it.isUser}}" hint-placeholder-val="{{false}}">
              <div style="align-self: flex-end; max-width: 520px; padding: 12px 16px; border-radius: 14px 14px 4px 14px; background: var(--surface-2); font-size: 15px; line-height: 1.55;">{{it.text}}</div>
            </sc-if>

            <sc-if value="{{it.isGK}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 8px; max-width: 640px;">
                <span style="display: flex; align-items: center; gap: 10px;">
                  <span style="font-size: 12px; font-weight: 600; color: var(--accent-ink);">Ebb</span>
                  <span style="font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>General knowledge · not from your notes</span>
                </span>
                <p style="margin: 0; font-size: 16px; line-height: 1.6;">{{it.text}}</p>
              </div>
            </sc-if>

            <sc-if value="{{it.isNotice}}" hint-placeholder-val="{{false}}">
              <div role="status" style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3);">
                <span style="flex: 1; height: 1px; background: var(--line);"></span>
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M4 7h13l-3-3M20 17H7l3 3"></path></svg>
                <span>Switched to a backup model while the main one is busy. Answers may be a little slower.</span>
                <span style="flex: 1; height: 1px; background: var(--line);"></span>
              </div>
            </sc-if>

            <sc-if value="{{it.isShort}}" hint-placeholder-val="{{false}}">
              <article aria-label="Short-answer question" style="border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);">Short answer · DNS resolution</span>
                <h3 style="margin: 0; font-family: var(--serif); font-weight: 500; font-size: 21px; line-height: 1.35;">{{it.q}}</h3>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <span style="font-size: 13px; color: var(--ink-3);">Your answer</span>
                  <p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; line-height: 1.55;">{{it.answer}}</p>
                </div>
              </article>
            </sc-if>

            <sc-if value="{{it.isMcq}}" hint-placeholder-val="{{false}}">
              <article aria-label="Multiple-choice question" style="border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);">
                <div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
                  <span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);">Multiple choice · Subnetting</span>
                  <span style="font-size: 12px; color: var(--ink-3);">Press <kbd style="font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px;">1</kbd>–<kbd style="font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px;">4</kbd> to choose, <kbd style="font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px;">Enter</kbd> to submit</span>
                </div>
                <fieldset onKeyDown="{{it.onKey}}" style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
                  <legend style="padding: 0 0 12px; font-family: var(--serif); font-weight: 500; font-size: 21px; line-height: 1.35;">A host has the address 192.168.10.70/26. How many usable host addresses does its subnet have?</legend>
                  <sc-for list="{{it.options}}" as="o" hint-placeholder-count="4">
                    <label class="opt" style="{{o.style}}">
                      <input type="radio" name="mcq-subnet" checked="{{o.checked}}" onChange="{{o.pick}}" disabled="{{it.locked}}" style="width: 18px; height: 18px; margin: 0; accent-color: var(--accent-ink);">
                      <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font: 500 13px var(--mono); color: var(--ink-2); flex: none;">{{o.n}}</span>
                      <span style="flex: 1; font-size: 17px; font-weight: 500;">{{o.text}}</span>
                      <span style="font-size: 13px; font-weight: 500; color: var(--ink-2);">{{o.tag}}</span>
                    </label>
                  </sc-for>
                </fieldset>
                <sc-if value="{{it.showSubmit}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; justify-content: flex-end;">
                    <button type="button" onClick="{{it.submit}}" disabled="{{it.cantSubmit}}" class="pbtn" style="{{it.submitStyle}}">Check answer</button>
                  </div>
                </sc-if>
              </article>
            </sc-if>

            <sc-if value="{{it.isStream}}" hint-placeholder-val="{{false}}">
              <div aria-live="polite" style="display: flex; flex-direction: column; gap: 6px; max-width: 640px;">
                <span style="font-size: 12px; font-weight: 600; color: var(--accent-ink); display: inline-flex; align-items: center; gap: 8px;">Ebb <span style="font-weight: 400; color: var(--ink-3); animation: ebb-pulse 1.2s ease-in-out infinite;">{{it.label}}</span></span>
                <p style="margin: 0; font-size: 16px; line-height: 1.6;">{{it.text}}<span class="caret" aria-hidden="true"></span></p>
              </div>
            </sc-if>

            <sc-if value="{{it.isGrade}}" hint-placeholder-val="{{false}}">
              <article aria-label="{{it.aria}}" style="border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: visible; box-shadow: var(--shadow);">
                <div style="{{it.headStyle}}">
                  <span style="display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px;">
                    <sc-if value="{{it.isC}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
                    <sc-if value="{{it.isP}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" style="fill: none; stroke: currentColor; stroke-width: 2"></circle><path d="M12 4a8 8 0 0 1 0 16z" style="fill: currentColor"></path></svg></sc-if>
                    <sc-if value="{{it.isI}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round"><path d="M6 6l12 12M18 6 6 18"></path></svg></sc-if>
                    {{it.verdict}}
                  </span>
                  <span style="font-size: 13px; color: var(--ink-2);">{{it.tideNote}}</span>
                </div>
                <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
                  <p style="margin: 0; font-size: 16px; line-height: 1.6;">{{it.explanation}}</p>
                  <div style="position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
                    <span style="font-size: 13px; color: var(--ink-3);">Sources</span>
                    <sc-for list="{{it.cites}}" as="c" hint-placeholder-count="2">
                      <button type="button" onClick="{{c.toggle}}" aria-expanded="{{c.expanded}}" aria-haspopup="dialog" class="hov" style="height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent-ink); font: 500 12px var(--mono); cursor: pointer;">[{{c.label}}]</button>
                    </sc-for>
                    <sc-if value="{{it.popOpen}}" hint-placeholder-val="{{false}}">
                      <div role="dialog" aria-label="Source snippet" onKeyDown="{{it.popKey}}" style="position: absolute; top: 42px; left: 0; z-index: 5; width: min(440px, 100%); padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <span style="font-size: 13px; font-weight: 500; color: var(--ink-2);">CSE321_Lecture_Notes_Wk1-6.pdf · page {{it.pop.page}}</span>
                          <button type="button" onClick="{{it.closePop}}" aria-label="Close source snippet" autoFocus="{{true}}" class="hov" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
                        </div>
                        <blockquote style="margin: 0; padding: 0 0 0 0; font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink);">“{{it.pop.before}}<mark style="background: var(--accent-soft); color: var(--ink); padding: 0 2px; border-radius: 3px;">{{it.pop.mark}}</mark>{{it.pop.after}}”</blockquote>
                        <a href="#" style="font-size: 13px; font-weight: 500;">Open page {{it.pop.page}} in notes</a>
                      </div>
                    </sc-if>
                  </div>
                  <sc-if value="{{it.isChecking}}" hint-placeholder-val="{{false}}">
                    <p role="status" style="margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14px; color: var(--ink-2); animation: ebb-pulse 1.2s ease-in-out infinite;">Dispute sent. A second grader is re-checking your answer…</p>
                  </sc-if>
                  <sc-if value="{{it.isResolved}}" hint-placeholder-val="{{false}}">
                    <p role="status" style="margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14px; line-height: 1.5; color: var(--ink);"><strong style="font-weight: 600;">Re-check complete.</strong> {{it.resolvedText}}</p>
                  </sc-if>
                  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding-top: 4px; border-top: 1px solid var(--line);">
                    <span style="font-size: 13px; color: var(--ink-3); padding-top: 10px;">Graded against your notes</span>
                    <sc-if value="{{it.canDispute}}" hint-placeholder-val="{{true}}">
                      <button type="button" onClick="{{it.dispute}}" class="hov" style="margin-top: 10px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 13px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M5 21V4h10l-1.5 4L15 12H5"></path></svg>Dispute grade</button>
                    </sc-if>
                  </div>
                </div>
              </article>
            </sc-if>

            <sc-if value="{{it.isResource}}" hint-placeholder-val="{{false}}">
              <a href="https://www.cloudflare.com/learning/dns/what-is-dns/" target="_blank" rel="noopener" class="hov" style="max-width: 560px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); display: flex; gap: 14px; align-items: center;">
                <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--accent-ink);"><svg width="20" height="20" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M4 5h11l5 5v9H4z"></path><path d="M8 11h8M8 15h6"></path></svg></span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                  <span style="font-size: 12px; color: var(--ink-3);">Suggested reading · 8 min · cloudflare.com</span>
                  <span style="font-weight: 500; font-size: 15px;">What is DNS? How resolvers, caching and TTL fit together</span>
                </span>
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M7 17 17 7M9 7h8v8"></path></svg>
              </a>
            </sc-if>

            <sc-if value="{{it.isNext}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 10px; max-width: 640px;">
                <span style="font-size: 12px; font-weight: 600; color: var(--accent-ink);">Ebb</span>
                <p style="margin: 0; font-size: 16px; line-height: 1.6;">{{it.text}}</p>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                  <a href="Flashcards.dc.html" class="pbtn" style="height: 44px; padding: 0 16px; border-radius: 10px; background: var(--primary-bg); color: var(--primary-ink); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center;">Review weak cards</a>
                  <a href="Exam.dc.html" class="hov" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center;">Take a 5-question exam</a>
                </div>
              </div>
            </sc-if>

          </sc-for>
        </div>
      </sc-if>

      <!-- composer -->
      <div style="position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 14px clamp(16px, 3vw, 40px) 18px;">
        <div style="max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">

              <span style="font-size: 15px;">{{r.label}}</span>
            </label>

        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">

          <button type="button" onClick="{{sendDispute}}" class="pbtn" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--primary-bg); color: var(--primary-ink); font: 500 14px var(--sans); cursor: pointer;">Send for re-check</button>

</div>

      </section>

                    <span style="{{c.nextStyle}}">{{c.next}}</span>

              </sc-for>
              <sc-if value="{{st.empty}}" hint-placeholder-val="{{false}}">
                <p style="margin: 0; font-size: 13px; color: var(--ink-3);">Nothing here yet.</p>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</template>

class Component extends DCLogic {
  constructor(...a) { super(...a); this.state = Object.assign({}, this.state, { dark: null, sel: 'subnet' }); }
  isDark() {
    if (this.state.dark !== null) return this.state.dark;
    const t = this.props.theme ?? 'remember';
    if (t === 'dark') return true;
    if (t === 'light') return false;
    try { return localStorage.getItem('ebb-theme') === 'dark'; } catch (e) { return false; }
  }
  series(final, reviews) {
    const last = reviews[reviews.length - 1];
    const d = Math.pow(final / 95, 1 / (29 - last));
    const early = Math.pow(d, 1.8);
    const out = [];
    let L = 78;
    for (let t = 0; t <= 29; t++) {
      if (t > 0) L = L * (t <= last ? early : d);
      if (reviews.indexOf(t) >= 0) L = 95;
      out.push(L);
    }
    out[29] = final;
    const proj = [final];
    for (let k = 1; k <= 3; k++) proj.push(final * Math.pow(d, k));
    return { pts: out, proj: proj };
  }

    const dark = this.isDark();
    const s = this.state;
    const self = this;

      { id: 'osi', name: 'OSI layers', lvl: 92, reviews: [1, 8, 20], stage: 5, next: 'Next in 26 days' },
      { id: 'tcp', name: 'TCP handshake', lvl: 86, reviews: [3, 11, 25], stage: 4, next: 'Next in 12 days' },
      { id: 'http', name: 'HTTP vs HTTPS', lvl: 71, reviews: [5, 13, 24], stage: 3, next: 'Next in 2 days' },
      { id: 'udp', name: 'UDP', lvl: 63, reviews: [6, 14, 22], stage: 3, next: 'Tomorrow' },
      { id: 'dns', name: 'DNS resolution', lvl: 52, reviews: [4, 12, 24], stage: 2, next: 'Due today', due: true },
      { id: 'routing', name: 'Routing', lvl: 44, reviews: [2, 9, 21], stage: 2, next: 'Due today', due: true },
      { id: 'subnet', name: 'Subnetting', lvl: 29, reviews: [3, 10, 22], stage: 1, next: 'Overdue 1 day', due: true },
      { id: 'nat', name: 'NAT', lvl: 0, reviews: [], stage: 0, next: 'Not started', never: true }

    // big chart mapping: 33 days (30 past + 3 projected)
    const bx = (t) => 40 + (t / 32) * 850;
    const by = (v) => 210 - (v / 100) * 190;

        out.points = ser.pts.map((v, t) => r1(sx(t)) + ',' + r1(sy(v))).join(' ');
        const dot = (x, y, r) => 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
        out.dotPath = c.reviews.map((t) => dot(r1(sx(t)), r1(sy(95)), 3)).join(' ');
        out.bigDotPath = c.reviews.map((t) => dot(r1(bx(t)), r1(by(95)), 5)).join(' ');
        out.bigPoints = ser.pts.map((v, t) => r1(bx(t)) + ',' + r1(by(v))).join(' ');
        out.projPoints = ser.proj.map((v, k) => r1(bx(29 + k)) + ',' + r1(by(v))).join(' ');
        out.aria = c.name + ' tide over the last 30 days: reviewed ' + c.reviews.length + ' times, now ' + c.lvl + ' percent, about ' + Math.round(ser.proj[3]) + ' percent in 3 days without review.';
      } else {
        out.points = ''; out.dotPath = ''; out.bigPoints = ''; out.projPoints = ''; out.bigDotPath = '';
        out.aria = 'NAT: not studied yet.';
      }
      const on = s.sel === c.id;
      out.pressed = on ? 'true' : 'false';
      out.pick = () => { if (!c.never) self.setState({ sel: c.id }); };
      out.cardStyle = 'text-align: left; padding: 12px 14px; border-radius: 12px; cursor: ' + (c.never ? 'default' : 'pointer') + '; display: flex; flex-direction: column; gap: 8px; font: inherit; background: ' + (on ? 'var(--accent-soft)' : 'var(--bg)') + '; border: 1.5px solid ' + (on ? 'var(--accent-ink)' : 'var(--line)') + ';';
      out.nextStyle = 'font-size: 12px; ' + (c.due ? 'color: var(--partial); font-weight: 600;' : 'color: var(--ink-3);');
      return out;
    });

        open ? h('nav', { 'aria-label': 'Prototype screens', className: 'proto-panel' },
          groups.map(function (g) {
            return h('div', { key: g.name, className: 'proto-group' },
              h('p', null, g.name),
              g.items.map(function (r) {
                return h('a', { key: r.name, href: '#/' + r.name, 'aria-current': r.name === self.props.current ? 'page' : undefined }, r.title);
              }));
          })) : null,
        h('button', { type: 'button', 'aria-expanded': open ? 'true' : 'false', onClick: function () { self.setState({ open: !open }); } }, open ? 'Close' : 'Screens'));
    }
  }

  class App extends React.Component {
    constructor(p) { super(p); this.state = { name: current() }; }
    componentDidMount() {
      var self = this;
      window.addEventListener('hashchange', function () { self.setState({ name: current() }); window.scrollTo(0, 0); });
      this.title();
    }
    componentDidUpdate() { this.title(); }
    title() { document.title = 'Ebb prototype · ' + SCREENS[this.state.name].meta.title; }
    render() {
      var sc = SCREENS[this.state.name];
      var screen = h(sc.Cls, Object.assign({ key: sc.meta.name }, sc.meta.defaults));
      var body = sc.meta.fill ? screen : h('div', { className: 'proto-stage' }, h('div', { style: { width: sc.meta.w + 'px', flex: 'none', boxShadow: '0 10px 40px rgba(15,27,45,.18)', borderRadius: sc.meta.w < 500 ? '24px' : '8px', overflow: 'hidden' } }, screen));
      return h(React.Fragment, null, body, h(Menu, { key: 'menu-' + sc.meta.name, current: sc.meta.name }));
    }
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
